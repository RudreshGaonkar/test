version: '3.8'

services:
  catalog-service:
    build: .
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=catalog-db
      - DB_PORT=5432
      - DB_USER=catalog_user
      - DB_PASSWORD=catalog_pass
      - DB_NAME=catalogdb
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - catalog-net

  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
      POSTGRES_DB: catalogdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalogdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - catalog-net

volumes:
  catalog_data:

networks:
  catalog-net:
    driver: bridge
