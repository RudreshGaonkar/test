version: '3.8'

services:
  users-service:
    build: .
    container_name: users-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=users-db
      - DB_PORT=5432
      - DB_USER=users_user
      - DB_PASSWORD=users_pass
      - DB_NAME=usersdb
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - users-net

  users-db:
    image: postgres:15-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_pass
      POSTGRES_DB: usersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_user -d usersdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - users_data:/var/lib/postgresql/data
    networks:
      - users-net

volumes:
  users_data:

networks:
  users-net:
    driver: bridge
