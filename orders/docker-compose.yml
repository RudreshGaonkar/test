version: '3.8'

services:
  orders-service:
    build: .
    container_name: orders-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=orders-db
      - DB_PORT=5432
      - DB_USER=orders_user
      - DB_PASSWORD=orders_pass
      - DB_NAME=ordersdb
      # Inter-service sync endpoints
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://10.128.0.9:3001}
      - USERS_SERVICE_URL=${USERS_SERVICE_URL:-http://10.128.0.10:3003}
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - orders-net

  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: ordersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d ordersdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - orders_data:/var/lib/postgresql/data
    networks:
      - orders-net

volumes:
  orders_data:

networks:
  orders-net:
    driver: bridge
